name: Refresh Letterboxd data

on:
  schedule:
    - cron: "17 9 * * *" # daily; odd minute to avoid the on-the-hour rush
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch most recent watches
        run: node scripts/fetch-activity.mjs

      # Historical diary backfill leaves many missing posters; bound the daily
      # requests while the catalogue fills incrementally.
      - name: Fetch posters for new films
        run: node scripts/fetch-posters.mjs --limit=100

      # Both counts are on the card, so they refresh together on one commit.
      - name: Fetch follower counts
        run: node scripts/fetch-followers.mjs

      - name: Commit if changed
        id: commit
        run: |
          git add src/data/people.json src/data/people/ src/data/films.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Letterboxd activity and follower data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Tell IndexNow the pages changed
        if: steps.commit.outputs.changed == 'true'
        run: node scripts/submit-indexnow.mjs
